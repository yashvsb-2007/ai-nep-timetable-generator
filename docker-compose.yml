version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nep_timetable_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nep_timetable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nep_timetable_server
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nep_timetable
      JWT_SECRET: nep2020_super_jwt_secret_key_2026
      AI_ENGINE_URL: http://ai-engine:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_started

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: nep_timetable_ai
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nep_timetable_client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
